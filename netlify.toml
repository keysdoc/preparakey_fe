[build]
  command = "npm audit --audit-level=high && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "10.9.8"

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/js/config.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
